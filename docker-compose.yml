version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: cafe-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cafe_management
      MYSQL_USER: cafe_user
      MYSQL_PASSWORD: cafe_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cafe-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cafe_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cafe-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8081
    container_name: cafe-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cafe-network

  # Jenkins Service
  jenkins:
    build:
      context: ./docker/jenkins
      dockerfile: Dockerfile
    # image: jenkins/jenkins:lts-jdk21  # Jenkins image với Java 21 (LTS)
    container_name: cafe-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"  # Jenkins UI port
      - "50000:50000"  # Port cho Jenkins agents
    volumes:
      - jenkins_home:/var/jenkins_home  # Dữ liệu Jenkins sẽ được lưu trữ ngoài container
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cafe-network
    environment:
      JENKINS_OPTS: "--httpPort=8080"
    depends_on:
      - backend  # Jenkins cần phải chạy sau backend

networks:
  cafe-network:
    driver: bridge

volumes:
  mysql_data:
  jenkins_home:
